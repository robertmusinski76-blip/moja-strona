<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRAP CAR - Stacja Demontażu Pojazdów Jordanów</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: #000;
            color: #fff;
            text-align: center;
        }
        header {
            padding: 20px;
            background: #111;
            border-bottom: 3px solid #ff8c00;
        }
        .logo-img {
            max-width: 250px;
            height: auto;
        }
        .hero-banner {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
        }
        .contact-box {
            background: #1a1a1a;
            padding: 30px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 15px;
        }
        .btn-fb {
            display: inline-block;
            background-color: #1877F2;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-fb:hover {
            background-color: #145dbf;
            transform: scale(1.05);
        }
        .phone {
            font-size: 32px;
            color: #ff8c00;
            text-decoration: none;
            display: block;
            margin: 15px 0;
            font-weight: bold;
        }
        .services {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }
        .service-card {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
            border-top: 4px solid #ff8c00;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpg" alt="SCRAP CAR Logo" class="logo-img">
    </header>

    <img src="baner.jpg" alt="Złomowanie Pojazdów Jordanów" class="hero-banner">

    <div class="contact-box">
        <h2>Potrzebujesz wyceny? Zadzwoń!</h2>
        <a href="tel:660693518" class="phone"><i class="fas fa-phone"></i> 660 693 518</a>
        <p>Jordanów 19, 95-060 Brzeziny</p>
        
        <a href="https://www.facebook.com/ScrapCarJordanow/" target="_blank" class="btn-fb">
            <i class="fab fa-facebook"></i> Odwiedź nas na Facebooku
        </a>
    </div>

    <div class="services">
        <div class="service-card">
            <i class="fas fa-car-crash fa-3x" style="color:#ff8c00"></i>
            <h3>Złomowanie</h3>
            <p>Gotówka od ręki i zaświadczenie w 15 minut.</p>
        </div>
        <div class="service-card">
            <i class="fas fa-truck-pickup fa-3x" style="color:#ff8c00"></i>
            <h3>Własna Laweta</h3>
            <p>Darmowy odbiór pojazdów od klienta.</p>
        </div>
        <div class="service-card">
            <i class="fas fa-tools fa-3x" style="color:#ff8c00"></i>
            <h3>Części Używane</h3>
            <p>Szeroki wybór części do wielu marek.</p>
        </div>
    </div>

</body>
</html>
