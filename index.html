<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Strona | GitHub Pages</title>
    <style>
        /* Stylistyka strony */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        .links {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-btn {
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }

        .link-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Witaj na mojej stronie! 👋</h1>
        <p>To jest moja pierwsza strona hostowana całkowicie za darmo na GitHub Pages. Używam AI do jej stworzenia i zarządzania treścią.</p>
        
        <div class="links">
            <a href="#" class="link-btn">Moje Projekty</a>
            <a href="#" class="link-btn">Skontaktuj się ze mną</a>
            <a href="https://github.com" class="link-btn" style="background: #ffffff;">Mój GitHub</a>
        </div>

        <div class="footer">
            Stworzono w 2026 r. przy pomocy Gemini
        </div>
    </div>

</body>
